[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "henri"
version = "0.6.0"
description = "HENRI v6 - wave-mechanical kernel, built from first principles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The suite is not runnable from this metadata without all four. Measured:
# without `sentence-transformers` the backbone silently uses its char-ngram
# fallback and four tests fail; without fastapi/httpx two modules fail to
# collect; without pillow two sensor-ingress tests raise. The holarch tests
# need torch and scikit-learn (8x8 digits); without them those modules fail
# to import rather than skip.
holarch = [
    "torch>=2.1",
    "scikit-learn>=1.3",
    "psycopg[binary]>=3.1",
]
test = [
    "pytest>=7.4",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pillow>=10.0",
    "sentence-transformers>=2.7",
    "torch>=2.1",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
include = ["henri*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "hardware: requires GPU/CUDA; BLOCKED on CPU (skip by default)",
    "slow: full-D (65536) run; not part of the default gate sweep",
    "gate: ports an acceptance gate from the HENRI verification matrix",
]